[project]
name = "codex-seo"
version = "2.5.0+codex.1"
description = "Comprehensive SEO analysis skill suite for Codex"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Daniel Agrici"}
]
keywords = ["seo", "codex", "codex-skills", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/Joseemm96/codex-seo"
Repository = "https://github.com/Joseemm96/codex-seo"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
